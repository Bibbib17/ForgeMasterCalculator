<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Race Performance Predictor</title>
  <meta name="description" content="Predict race times across distances using your recent performance, training volume, and race-day conditions." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg"></div>
  <main class="container">
    <header class="hero">
      <p class="eyebrow">Smart race planning</p>
      <h1>Race Performance Predictor</h1>
      <p class="subtitle">Turn one recent race into realistic forecasts for your next 5K, 10K, Half, or Marathon.</p>
    </header>

    <section class="card grid">
      <form id="predictorForm" class="panel" aria-label="Race inputs">
        <h2>Your Inputs</h2>

        <label for="baseDistance">Recent Race Distance</label>
        <select id="baseDistance" required>
          <option value="5">5K</option>
          <option value="10">10K</option>
          <option value="21.097">Half Marathon</option>
          <option value="42.195">Marathon</option>
        </select>

        <label for="baseTime">Recent Race Time</label>
        <input id="baseTime" type="text" inputmode="numeric" placeholder="HH:MM:SS or MM:SS" value="00:45:00" required />

        <label for="weeklyMileage">Average Weekly Mileage (km)</label>
        <input id="weeklyMileage" type="number" min="0" max="300" step="1" value="45" required />

        <label for="elevation">Course Elevation Gain (m)</label>
        <input id="elevation" type="number" min="0" max="3000" step="10" value="120" required />

        <label for="temperature">Race-Day Temperature (°C)</label>
        <input id="temperature" type="number" min="-10" max="45" step="1" value="14" required />

        <label for="goalStyle">Goal Style</label>
        <select id="goalStyle" required>
          <option value="balanced">Balanced</option>
          <option value="aggressive">Aggressive</option>
          <option value="conservative">Conservative</option>
        </select>

        <button type="submit">Predict My Race</button>
      </form>

      <section class="panel" aria-live="polite">
        <div class="result-header">
          <h2>Prediction</h2>
          <p id="confidenceBadge" class="badge">Confidence: --</p>
        </div>

        <div id="primaryResult" class="primary-result">
          <p class="result-label">Suggested target</p>
          <h3>10K · 00:00:00</h3>
          <p id="paceText">Pace: -- /km</p>
        </div>

        <div id="distanceCards" class="distance-cards"></div>

        <h3>5K Split Plan</h3>
        <div id="splits" class="splits"></div>

        <h3>Race Readiness</h3>
        <div class="meter-wrap">
          <div id="readinessBar" class="meter-bar"></div>
        </div>
        <p id="insightText" class="insight"></p>
      </section>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
